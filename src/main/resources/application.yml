server:
  forward-headers-strategy: native
  port: 8080
  tomcat:
    max-swallow-size: 10MB
spring:
  kafka:
    bootstrap-servers: smartseat-bhavyagodhaniya2004-2234.k.aivencloud.com:26025

    properties:
      security.protocol: SSL

      ssl.truststore.type: PEM
      ssl.truststore.location: classpath:ca.pem

      schema.registry.url: ${KAFKA_URL}

      basic.auth.credentials.source: USER_INFO
      basic.auth.user.info: ${KAFKA_PASSWORD}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: my-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      properties:
        spring.json.value.default.type: java.util.HashMap
        spring.json.trusted.packages: "*"
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      chat:
        options:
          model: gemini-2.0-flash
          temperature: 0.7
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 2
      connection-timeout: 5000
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: postgres.axxwxwxnqteramwkrwrn
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        order_inserts: true
        generate_statistics: false
        jdbc:
          batch_size: 100
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  cloudinary:
    url: ${CLOUDINARY_URL}
logging:
  level:
    # Disable PDFBox and Fontbox warnings to keep the console clean
    org.apache.pdfbox: OFF
    org.apache.fontbox: OFF
    # Optional: Log the exact HTTP requests to Ollama
    org.springframework.ai.ollama: DEBUG
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include : health,info,metrics,loggers